{% load crispy_forms_tags %} 


                    <form method="post" enctype="multipart/form-data" id="dataset_form" action="{% url 'save_csv_dataset' %}" 
                        onsubmit="event.preventDefault();submit_dataset_form();">
                        {% csrf_token %}
            
                        <div class="container">
                            <!-- Row for Form Fields -->
                            <div class="row mb-3">
                                <div class="col-md-12">	
                                    
                                    <div class="form-group">
                                        <label for="{{ datasetForm.description.id_for_label }}">Description</label>
                                        {{ datasetForm.description }}
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label for="{{ datasetForm.dataset.id_for_label }}">Dataset</label>
                                        {{ datasetForm.dataset }}
                                    </div>
                                </div>
                            </div>

                            <!-- Submit Button Row -->
                            <div class="row">
                                <div class="col-md-12">
                                    <button type="submit" class="btn btn-sm btn-outline-purple full-width right"><icon class="fa fa-upload h-padding-10"></icon> Upload</button>
                                </div>
                            </div>
                        </div>
                    </form>
                







 
                             
<script type="text/javascript">

	function submit_dataset_form(){
		ajax_submit("{% url 'save_csv_dataset'%}",'csv_dataset_tab','dataset_form','POST', '', on_dataset_success);
	}

	function on_dataset_success(){
		afterAjaxResponse('csv_dataset_tab');	
		ajax_submit("{% url 'save_csv_dataset'%}", 'csv_dataset_tab');
        ajax_submit("{% url 'save_images_dataset'%}", 'images_dataset_tab');
		ajax_submit("{% url 'list_all_datasets'%}", 'list_all_datasets');
	}

	function collapse_check_when_error($selector){
		if($($selector).find( '.invalid-feedback').length > 0 ){
			$($selector).collapse("show");
		}else{
			$($selector).collapse("hide");
		}
	}
			collapse_check_when_error("#csv_dataset_tab");
</script>

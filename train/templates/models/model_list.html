 

 
    <div class="row">
        {% for model in model_list %}
        <div class="col-lg-12 col-md-12 col-sm-12 mb-4 h-padding-0">

            <div class="card   card-purple card-outline">
                <!-- Card Header -->
                <div class="card-header">
                    <div class="full-width">
                        <h4>{{ model.description }}</h4>
                    </div>
                </div>
                <!-- Card Body -->
                <div class="card-body">
                   
                    <div class="row" id="model_form_wrapper_{{model.id}}">
                        <div class="col-lg-12 col-md-12 col-sm-12" >
                            <br/></br/>
                            <i class="fa fa-circle-o-notch fa-spin center" class="text-xl"></i>
                        </div>
                    </div>

                    <div class="row h-padding-0" >
                        <div id="model_results_wrapper_{{model.id}}" class="col-lg-12 col-md-12 col-sm-12 h-padding-0" >
                            
                        </div>
                    </div>

                    
                    <p class=" text-vs right v-margin-0"> {{ model.description }} on {{ model.dataset.description }} </p>
                </div>
            </div>
        </div>
         
            {% if  model_list_count > 0 %}
            <script>
                ajax_submit("{% url 'load_model_by_id' model.id %}", "model_form_wrapper_{{model.id}}");
            </script>
            {% endif %}
         
        {% endfor %}
		 
		{% if  model_list_count <= 0 %}
		<script>

            
             

			// Trigger collapse to show if the model_list is empty
			$(document).ready(function() {
				$('#model_list_wrapper').collapse('show');
			});
		</script>
		<div class="row">
			<div class="col-md-12 col-lg-12 col-sm-12 center padding-0">
			<span class="d-flex justify-content-center align-items-center" style="height: 70vh;">
				<div class="card " style="width: 100%; height: 70vh;">
					<div class="card-body text-center card-vertical-center">
						<i class="fas fa-microscope text-purple" style="font-size: 10vh;"></i>
						<br/>
						<h5 class="card-text mt-3">Train the model to start predicting</h5>
					</div>
				</div>
			</span>
		</div>

		</div>
			
			
			
		{% endif %}
        

    </div>
</div>

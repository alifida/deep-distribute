<script type="text/javascript">
      $(document).ready(function() {
		ajax_submit("{% url 'list_deployed_models'%}", 'model_list_wrapper');
      	ajax_submit("{% url 'save_csv_dataset'%}", 'dataset_form_wrapper');
      	ajax_submit("{% url 'list_csv_dataset'%}", 'dataset_list_wrapper');
      });
</script>


<script type="text/javascript">
    function toggleRequiredFields(model_id) {
        var fileInput = document.getElementById('supply_dataset_'+model_id);
        var formInputs = document.querySelectorAll('#model_prediction_form_'+model_id+' .required-form-control');
        if (fileInput.files.length > 0) {
            formInputs.forEach(function(input) {
                input.removeAttribute('required');
            });
        } else {
            formInputs.forEach(function(input) {
                input.setAttribute('required', 'required');
            });
        }
    }

    var disable_prediction = false;
    active_model="";
    function submit_model_prediction_form(model_id) {
        active_model= model_id; 
        if(disable_prediction == false){
            display_loader(".prediction-btn"+model_id);
            disable_prediction = true;
            
            ajax_submit("{% url 'predict_trained_model' %}", 'model_results_wrapper_'+model_id, 'model_prediction_form_'+model_id, 'POST', '', after_submit_model_prediction_form);
        }
    }

    function after_submit_model_prediction_form(res) {
        hide_loader(".prediction-btn_"+active_model);  
        disable_prediction = false; 
        $("#model_results_wrapper_"+active_model).html(res);
        $("#model_results_wrapper_"+active_model).css('height', 'auto');
        active_model= ""; 
    }
</script>

  
{% endblock %}

<script>
    async function startJupyter(username) {
        // Make a POST request using fetch
        const response = await fetch("http://119.159.146.175:5000/start", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",  // Set Content-Type to JSON
            },
            body: JSON.stringify({ username: username })  // Send the data as JSON
        });

        // Parse the response from the Flask server
        const data = await response.json();

        if (data.url) {
            // Redirect to the URL returned by the Flask API
            window.location.href = data.url;
        } else {
            // Handle the error if no URL is provided
            alert("Error: " + data.error);
        }
    }
</script>




<script type="text/javascript">
    function toggleRequiredFields(model_id) {
        var fileInput = document.getElementById('supply_dataset_' + model_id);
        var formInputs = document.querySelectorAll('#model_prediction_form_' + model_id + ' .required-form-control');
        if (fileInput.files.length > 0) {
            formInputs.forEach(function(input) {
                input.removeAttribute('required');
            });
        } else {
            formInputs.forEach(function(input) {
                input.setAttribute('required', 'required');
            });
        }
    }

    var disable_prediction = false;
    var active_model = "";
    function submit_model_prediction_form(model_id) {
        active_model = model_id;
        if (disable_prediction == false) {
            display_loader(".prediction-btn" + model_id);
            disable_prediction = true;
            ajax_submit("{% url 'predict_csv_trained_model' %}", 'model_results_wrapper_' + model_id, 'model_prediction_form_' + model_id, 'POST', '', after_submit_model_prediction_form);
        }
    }

    function after_submit_model_prediction_form(res) {
        hide_loader(".prediction-btn_" + active_model);
        disable_prediction = false;
        $("#model_results_wrapper_" + active_model).html(res);
        $("#model_results_wrapper_" + active_model).css('height', 'auto');
        $("#model_results_wrapper_" + active_model).show('slow');

        active_model = "";
    }




    function submit_model_prediction_form_img(model_id) {
        active_model = model_id;
        if (disable_prediction == false) {
            display_loader(".prediction-btn" + model_id);
            disable_prediction = true;
            ajax_submit("{% url 'predict_img_trained_model' %}", 'model_results_wrapper_' + model_id, 'model_prediction_form_' + model_id, 'POST', '', after_submit_model_prediction_form);
        }
    }

    function after_submit_model_prediction_form_img(res) {
        hide_loader(".prediction-btn_" + active_model);
        disable_prediction = false;
        $("#model_results_wrapper_" + active_model).html(res);
        $("#model_results_wrapper_" + active_model).css('height', 'auto');

        active_model = "";
    }









	function after_delete_model(res){
		ajax_submit("{% url 'list_deployed_models'%}", 'model_list_wrapper');
	}
</script>

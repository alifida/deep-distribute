

{% for prediction in predictions %}
<hr/>
        <div class="row ">
            <div class="col-lg-8 col-md-8 col-sm-8">
                <div class="row">
                {% for key, value in prediction.items %}
                    {% if key != class_label %}
                            <div class="col-lg-2 col-md-2 col-sm-3">
                                <label class="right">{{ key }} : </label> 
                            </div>
                            <div class="col-lg-2 col-md-2 col-sm-3">
                                <label class="left"> {{ value }} </label>
                            </div>
                    {% endif %}
                {% endfor %}
                </div>
            </div>
            <div class="col-lg-4 col-md-4 col-sm-4 ">
 
                {% for key, value in prediction.items %}
                    {% if key == class_label %}
                    <div class=" center ">
                        <div class=" circle-2 bg-info">
                            <h2> {{ value }} </h2>
                        </div>
                        <div class="text-center center-text text-sm"> {{ key }} </div>
                    </div>

                    {% endif %}
                {% endfor %}
            </div>
        </div>
        <br/><br/>
        
{% endfor %}
